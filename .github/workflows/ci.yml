name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Swift 6.1 (Xcode 16.4 on macos-15) crashes in IRGen on SettingsView.swift; build with a current toolchain.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit SHA (tag in the comment); bump both together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "Using $xcode"

      - name: Show toolchain
        id: toolchain
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          # The toolchain is part of the key: build products of another compiler can't be reused.
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test --parallel

      - name: Release build (warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Lint packaging plists
        run: plutil -lint Packaging/*.plist

      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      - name: Lint packaging scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck -x scripts/*.sh
